name: Cache Linux

on:
    workflow_call:
        inputs:
            build_type:
                required: true
                type: string


jobs:
    linux-build:
        runs-on: ubuntu-latest
    
        steps:
        - uses: actions/checkout@v5
          id: step1
          with:
            submodules: recursive
            ref: master
    
        - name: Patch SDL3
          id: step1f
          run: |
            cd vcpkg
            cp -u ../.github/tools/linux_impulse_triggers.patch ./ports/sdl3/linux_impulse_triggers.patch
            git apply ../.github/tools/SDL3_Linux_Impulse_Trigger_port.patch
            
        - name: Cache linux vcpkg
          id: step5
          uses: actions/cache@v4
          with: 
              path: ${{github.workspace}}/build/vcpkg_installed
              key: ${{runner.os}}-vcpkg-${{hashfiles('neo/linux-status')}}
              restore-keys: |
                ${{ runner.OS }}-vcpkg-
    
    
        - if: ${{ steps.step5.outputs.cache-hit != 'true' }}
          name: Configure CMake
          id: step6
          env:
            CC: gcc-14
            CXX: g++-14
          working-directory: ${{github.workspace}}/neo
          run: |
            sudo apt-get update
            sudo apt-get install -y build-essential autoconf libtool cmake ninja-build libglu1-mesa-dev freeglut3-dev mesa-common-dev libxmu-dev libxi-dev libgl-dev libx11-dev libxft-dev libxext-dev nasm libwayland-dev libxkbcommon-dev libegl1-mesa-dev libdecor-0-dev libxrandr-dev libxxf86vm-dev libx11-xcb-dev libxcb-dri2-0-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-keysyms1-dev libxcb-randr0-dev python3-jinja2 libltdl-dev bison linux-libc-dev autoconf-archive libxcursor-dev libxfixes-dev libxss-dev libxtst-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libgl1-mesa-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev liburing-dev
            cmake -B ${{github.workspace}}/build --preset=linux-${{inputs.build_type}}
    
        - name: Save logs - VCPKG
          if: ${{ failure() }}
          uses: actions/upload-artifact@v4
          with:
              name: vcpkg-linux-logs
              path: ${{github.workspace}}/vcpkg/buildtrees/*/*.log